<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prosper XO Newsletter Generator</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-panel: #1e293b;
      --bg-card: #334155;
      --border-color: #475569;
      --primary: #ffe94f;
      --primary-hover: #facc15;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 500px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      background: #0f172a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .form-content {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Draggable Section Card */
    .section-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
      overflow: hidden;
    }

    .section-card.dragging {
      opacity: 0.35;
      transform: scale(0.98);
      border: 2px dashed var(--primary);
    }

    .section-card.drag-over {
      border-top: 3px solid var(--primary);
      box-shadow: 0 -4px 10px rgba(255, 233, 79, 0.2);
    }

    .section-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.65);
      cursor: grab;
      user-select: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .section-header-bar:active {
      cursor: grabbing;
    }

    .section-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--primary);
    }

    .drag-handle {
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: grab;
      line-height: 1;
    }

    .section-header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 4px;
      padding: 3px 6px;
      cursor: pointer;
      font-size: 0.75rem;
      line-height: 1;
      transition: all 0.15s;
    }

    .btn-icon:hover {
      color: #fff;
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.05);
    }

    .section-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-body.collapsed {
      display: none;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(15, 23, 42, 0.5);
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .form-group label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--primary);
    }

    .form-group input[type="text"],
    .form-group input[type="date"],
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 8px 12px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group select { cursor: pointer; }
    .form-group input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    .form-group input[type="text"]:focus,
    .form-group input[type="date"]:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--primary); }
    .form-group textarea { resize: vertical; min-height: 65px; }

    .speaker-card, .link-item-row {
      border: 1px solid var(--border-color);
      background: rgba(15, 23, 42, 0.7);
      padding: 10px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .speaker-card h5, .link-item-header {
      font-size: 0.8rem;
      color: var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .color-picker-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .color-picker-row .form-group { flex: 1; }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .color-picker-wrapper input[type="color"] {
      -webkit-appearance: none;
      border: 1px solid var(--border-color);
      width: 34px;
      height: 34px;
      border-radius: 6px;
      cursor: pointer;
      background: none;
    }

    .preview-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000000;
    }

    .preview-toolbar {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .iframe-container {
      flex: 1;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      max-width: 640px;
      height: 100%;
      border: none;
      background: #f4f4f4;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .btn {
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary { background: var(--primary); color: #000; }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-secondary { background: var(--bg-card); color: #fff; border: 1px solid var(--border-color); }
    .btn-secondary:hover { background: var(--border-color); }

    .btn-add-section {
      background: rgba(255, 233, 79, 0.05);
      color: var(--primary);
      border: 2px dashed var(--primary);
      padding: 10px;
      width: 100%;
      font-size: 0.85rem;
    }
    .btn-add-section:hover { background: rgba(255, 233, 79, 0.15); }

    .btn-danger { background: #ef4444; color: #fff; padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; }
    .btn-danger:hover { background: #dc2626; }
  </style>
</head>
<body>

  <header>
    <h1>⚡ XO Insider Email Generator</h1>
    <div class="header-actions">
      <button class="btn btn-secondary" onclick="copyHTML()">📋 Copy HTML</button>
      <button class="btn btn-primary" onclick="downloadHTML()">💾 Download HTML</button>
    </div>
  </header>

  <div class="app-container">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Sections &amp; Reordering</h2>
        <span style="font-size: 0.75rem; color: var(--text-muted);">Drag ⋮⋮ or use ▲▼ to reorder</span>
      </div>
      <div class="form-content" id="form-controls"></div>
    </div>

    <div class="preview-area">
      <div class="preview-toolbar">
        <span>Live Preview</span>
        <span id="status-text">Ready</span>
      </div>
      <div class="iframe-container">
        <iframe id="preview-frame"></iframe>
      </div>
    </div>
  </div>

  <script>
    // Ordered List of Sections in the Newsletter
    let activeSections = [
      { id: 'townhall', type: 'townhall', title: 'Header & Town Hall' },
      { id: 'resource_month', type: 'resource_month', title: 'Resource of the Month' },
      { id: 'atx_musicians', type: 'atx_musicians', title: 'ATX Musicians' },
      { id: 'tala', type: 'tala', title: 'TALA' },
      { id: 'sims', type: 'sims', title: 'SIMS Foundation' },
      { id: 'haam', type: 'haam', title: 'HAAM' },
      { id: 'artist_voices', type: 'artist_voices', title: 'Artist Voices Wall' },
      { id: 'fuel_journey', type: 'fuel_journey', title: 'Fuel for the Journey' }
    ];

    let collapsedMap = {};
    let draggedIndex = null;

    // Town Hall Section State
    let townHallData = {
      image: 'https://prosperxo.com/assets/graphics/events/prosperxo-event-260708-1080x1440.jpeg',
      lumaLink: 'https://luma.com/ju3d23tb',
      date: 'July 8, 2026',
      location: 'Capital Factory in Austin, TX • ACL Room, 16th floor',
      sentences: [
        "The music industry often celebrates breakthroughs, viral moments, and success stories; but what does it actually take to build a sustainable career over the long term?",
        "Join Prosper XO for an evening exploring artist development, community, career sustainability, building a business, and the support systems that help artists grow, evolve, and thrive.",
        "From artist management and record labels to nonprofit support and community infrastructure, we'll discuss the realities of building a lasting career in music, the challenges artists face along the way, and what it takes to create an ecosystem where artists can succeed not just for a moment; but for a lifetime."
      ],
      speakers: [
        {
          name: 'Justin Weems',
          title: 'Founder, FSG | FSG Records',
          img: 'https://prosperxo.com/assets/graphics/events/speaker-pics/justin-weems.jpeg',
          description: ''
        },
        {
          name: 'Aaron McDonnell',
          title: 'Co-Owner, FSG Records | Artist',
          img: 'https://prosperxo.com/assets/graphics/events/speaker-pics/arron-mcdonnel.jpg',
          description: ''
        },
        {
          name: 'Jazz Mills',
          title: 'CEO, Free Lunch | Artist Manager | Artist',
          img: 'https://prosperxo.com/assets/graphics/events/speaker-pics/jazz-mills.JPG',
          description: ''
        }
      ],
      rsvpLink: 'https://luma.com/ju3d23tb'
    };

    // Resource of the Month State
    let resourceOfMonth = {
      orgName: 'Conspirare',
      imgUrl: 'https://prosperxo.com/assets/newsletter-preview/ProsperXO-Socia-ResourceofMonth-conspirare.jpg',
      description: 'Conspirare is a GRAMMY®-winning choir and nonprofit performing arts and music education organization that believes in the power of music to change lives, inspire peace, and foster belonging.',
      linkUrl: 'https://conspirare.org/'
    };

    // Standard Section Content States

    let atxMusiciansData = {
      title: 'AUSTIN TEXAS MUSICIANS',
      imgUrl: 'https://prosperxo.com/assets/newsletter-preview/July+ATXM+Event+Cover.jpg',
      date: 'July 7, 2026',
      subtitle: 'ATXM Night Shift Music Industry Mixer + Open Mic (Free)',
      text: "As Austin's longest-running music industry mixer, Night Shift continues to connect musicians, venues, industry professionals, nonprofit partners, and music supporters in a relaxed environment that fosters meaningful connections and career opportunities.",
      linkUrl: 'https://www.eventbrite.com/e/july-atxm-night-shift-music-industry-mixer-open-mic-free-tickets-1991317157222?keep_tld=true'
    };

    let talaData = {
      title: 'TALA',
      subtitle: 'Texas Accountants and Lawyers for the Arts',
      imgUrl: 'https://prosperxo.com/assets/newsletter-preview/tala_profile.jpg',
      text: 'Matching Texas artists and arts nonprofits with pro bono professional assistance since 1979.<br><br>Texas Accountants and Lawyers for the Arts believes that all creatives — regardless of income or background — deserve access to the business knowledge and advice necessary to grow a career in the arts. Our programs are designed to help participants apply sound business practices to protect intellectual property, advance careers, and develop income.',
      youtubeUrl: 'https://www.youtube.com/@talaoffice',
      aboutText: 'TALA offers free legal and accounting services to artists, craftspeople, and arts-centered nonprofit organizations from all creative disciplines, including visual arts, music, film and television, new media, writing and journalism, fashion design, theater, dance, and performing arts.'
    };

    let simsData = {
      title: 'SIMS Foundation',
      imgUrl: 'https://prosperxo.com/assets/newsletter-preview/SIMS-30.jpg',
      text: 'The SIMS Foundation provides mental health and substance use recovery services and supports for musicians, music industry professionals, and their dependent family members. Through education, community partnerships, and accessible managed care, SIMS seeks to destigmatize and reduce mental health and substance use issues, while supporting and enhancing the wellbeing of the music community at large.',
      instagramUrl: 'https://www.instagram.com/simsfoundation/',
      facebookUrl: 'https://www.facebook.com/simsfoundation'
    };

    let haamData = {
      title: 'Help HAAM Spread The Word About HAAM Membership',
      imgUrl: 'https://prosperxo.com/assets/newsletter-preview/prosperxo-newsletter-resource-haam.jpg',
      text: 'We want to make sure all local musicians, DJs, and music teachers know about HAAM! You can help by sharing the link below with your musician friends so they can request a HAAM application today!',
      joinUrl: 'https://myhaam.org/join-haam',
      instagramUrl: 'https://www.instagram.com/myhaam',
      facebookUrl: 'https://www.facebook.com/myhaam'
    };

    let artistVoicesWall = {
      bgColor: '#010101',
      textColor: '#ffffff',
      imgUrl: 'https://prosperxo.com/assets/artist-voices/ProsperXO-Social-ArtistVoices-2_1.jpg'
    };

    let fuelForJourney = {
      textLines: [],
      quote: '“We should consider every day lost on which we have not danced at least once.”',
      quoteAuthor: 'Friedrich Wilhelm Nietzsche'
    };

    let customSectionsData = {};

    window.onload = function() {
      buildControlsForm();
      updatePreview();
    };

    function buildControlsForm() {
      const formContainer = document.getElementById('form-controls');
      formContainer.innerHTML = '';

      const topAddBtn = document.createElement('button');
      topAddBtn.className = 'btn btn-add-section';
      topAddBtn.innerHTML = '➕ Add New Section';
      topAddBtn.onclick = () => addNewCustomSection();
      formContainer.appendChild(topAddBtn);

      let customCounter = 1;

      activeSections.forEach((sec, idx) => {
        const card = document.createElement('div');
        card.className = 'section-card';
        card.setAttribute('draggable', 'true');

        card.addEventListener('dragstart', (e) => {
          if (['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON'].includes(e.target.tagName)) {
            e.preventDefault();
            return;
          }
          draggedIndex = idx;
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', idx);
        });

        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          card.classList.add('drag-over');
        });

        card.addEventListener('dragleave', () => {
          card.classList.remove('drag-over');
        });

        card.addEventListener('drop', (e) => {
          e.preventDefault();
          card.classList.remove('drag-over');
          const targetIndex = idx;
          if (draggedIndex !== null && draggedIndex !== targetIndex) {
            const [movedItem] = activeSections.splice(draggedIndex, 1);
            activeSections.splice(targetIndex, 0, movedItem);
            buildControlsForm();
            updatePreview();
          }
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        });

        let displayTitle = sec.title;
        if (sec.type === 'custom') {
          displayTitle = `Custom Section #${customCounter++}`;
        }

        const headerBar = document.createElement('div');
        headerBar.className = 'section-header-bar';

        const headerLeft = document.createElement('div');
        headerLeft.className = 'section-header-left';
        headerLeft.innerHTML = `<span class="drag-handle" title="Drag to reorder">⋮⋮</span> <span>${escapeHtml(displayTitle)}</span>`;

        const headerActions = document.createElement('div');
        headerActions.className = 'section-header-actions';

        const upBtn = document.createElement('button');
        upBtn.className = 'btn-icon';
        upBtn.title = 'Move Section Up';
        upBtn.innerText = '▲';
        upBtn.onclick = (e) => {
          e.stopPropagation();
          moveSection(idx, -1);
        };
        headerActions.appendChild(upBtn);

        const downBtn = document.createElement('button');
        downBtn.className = 'btn-icon';
        downBtn.title = 'Move Section Down';
        downBtn.innerText = '▼';
        downBtn.onclick = (e) => {
          e.stopPropagation();
          moveSection(idx, 1);
        };
        headerActions.appendChild(downBtn);

        if (sec.type === 'custom' || sec.type === 'sims' || sec.type === 'haam') {
          const removeBtn = document.createElement('button');
          removeBtn.className = 'btn-icon';
          removeBtn.title = 'Remove Section';
          removeBtn.style.color = '#ef4444';
          removeBtn.innerText = '✕';
          removeBtn.onclick = (e) => {
            e.stopPropagation();
            removeSection(idx);
          };
          headerActions.appendChild(removeBtn);
        }

        const isCollapsed = !!collapsedMap[sec.id];
        const toggleBtn = document.createElement('button');
        toggleBtn.className = 'btn-icon';
        toggleBtn.title = isCollapsed ? 'Expand' : 'Collapse';
        toggleBtn.innerText = isCollapsed ? '▸' : '▾';
        toggleBtn.onclick = (e) => {
          e.stopPropagation();
          collapsedMap[sec.id] = !collapsedMap[sec.id];
          buildControlsForm();
        };
        headerActions.appendChild(toggleBtn);

        headerBar.appendChild(headerLeft);
        headerBar.appendChild(headerActions);
        card.appendChild(headerBar);

        const body = document.createElement('div');
        body.className = `section-body ${isCollapsed ? 'collapsed' : ''}`;
        renderSectionInputs(body, sec, displayTitle);
        card.appendChild(body);

        formContainer.appendChild(card);
      });

      const bottomAddBtn = document.createElement('button');
      bottomAddBtn.className = 'btn btn-add-section';
      bottomAddBtn.innerHTML = '➕ Add New Section';
      bottomAddBtn.onclick = () => addNewCustomSection();
      formContainer.appendChild(bottomAddBtn);

      const hasSIMS = activeSections.some(s => s.type === 'sims');
      const hasHAAM = activeSections.some(s => s.type === 'haam');

      if (!hasSIMS || !hasHAAM) {
        const restoreBox = document.createElement('div');
        restoreBox.className = 'form-group';
        restoreBox.style.marginTop = '10px';

        const label = document.createElement('label');
        label.innerText = 'Restore Removed Standard Sections';
        restoreBox.appendChild(label);

        if (!hasSIMS) {
          const addSimsBtn = document.createElement('button');
          addSimsBtn.className = 'btn btn-secondary';
          addSimsBtn.style.marginBottom = '6px';
          addSimsBtn.innerText = '➕ Add SIMS Foundation Section';
          addSimsBtn.onclick = () => {
            activeSections.push({ id: 'sims', type: 'sims', title: 'SIMS Foundation' });
            buildControlsForm();
            updatePreview();
          };
          restoreBox.appendChild(addSimsBtn);
        }

        if (!hasHAAM) {
          const addHaamBtn = document.createElement('button');
          addHaamBtn.className = 'btn btn-secondary';
          addHaamBtn.innerText = '➕ Add HAAM Section';
          addHaamBtn.onclick = () => {
            activeSections.push({ id: 'haam', type: 'haam', title: 'HAAM' });
            buildControlsForm();
            updatePreview();
          };
          restoreBox.appendChild(addHaamBtn);
        }

        formContainer.appendChild(restoreBox);
      }
    }

    function moveSection(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= activeSections.length) return;
      const [moved] = activeSections.splice(index, 1);
      activeSections.splice(newIndex, 0, moved);
      buildControlsForm();
      updatePreview();
    }

    function removeSection(index) {
      const sec = activeSections[index];
      if (sec.type === 'custom') {
        delete customSectionsData[sec.id];
      }
      activeSections.splice(index, 1);
      buildControlsForm();
      updatePreview();
    }

    function addNewCustomSection() {
      const newId = 'custom_' + Date.now();
      customSectionsData[newId] = {
        title: 'New Section',
        bgColor: '#1d00c2',
        textColor: '#ffffff',
        img: '',
        text: 'Enter description text here.',
        links: []
      };
      activeSections.push({ id: newId, type: 'custom', title: 'Custom Section' });
      buildControlsForm();
      updatePreview();
    }

    function renderSectionInputs(container, sec, displayTitle) {
      if (sec.type === 'townhall') {
        createTextInputGroup(container, 'th-img', 'Town Hall Image Link', townHallData.image, (val) => {
          townHallData.image = val;
          updatePreview();
        });

        createTextInputGroup(container, 'th-luma', 'Luma Link', townHallData.lumaLink, (val) => {
          townHallData.lumaLink = val;
          updatePreview();
        });

        createDatePickerGroup(container, 'th-date', 'Town Hall Date', townHallData.date, (formattedDate) => {
          townHallData.date = formattedDate;
          updatePreview();
        });

        createTextInputGroup(container, 'th-location', 'Location', townHallData.location, (val) => {
          townHallData.location = val;
          updatePreview();
        });

        const sentenceBox = document.createElement('div');
        sentenceBox.className = 'form-group';
        sentenceBox.innerHTML = '<label>Town Hall Description Sentences</label>';

        townHallData.sentences.forEach((sentence, sIdx) => {
          const row = document.createElement('div');
          row.style.display = 'flex';
          row.style.flexDirection = 'column';
          row.style.gap = '4px';
          row.style.marginBottom = '6px';

          const rowHeader = document.createElement('div');
          rowHeader.style.display = 'flex';
          rowHeader.style.justifyContent = 'space-between';
          rowHeader.style.alignItems = 'center';

          const subLabel = document.createElement('span');
          subLabel.innerText = `Sentence #${sIdx + 1}`;
          subLabel.style.fontSize = '0.75rem';
          subLabel.style.color = '#94a3b8';

          const delBtn = document.createElement('button');
          delBtn.className = 'btn btn-danger';
          delBtn.innerText = '✕ Delete';
          delBtn.onclick = () => {
            townHallData.sentences.splice(sIdx, 1);
            buildControlsForm();
            updatePreview();
          };

          rowHeader.appendChild(subLabel);
          rowHeader.appendChild(delBtn);
          row.appendChild(rowHeader);

          const textarea = document.createElement('textarea');
          textarea.value = sentence;
          textarea.addEventListener('input', (e) => {
            townHallData.sentences[sIdx] = e.target.value;
            updatePreview();
          });
          row.appendChild(textarea);
          sentenceBox.appendChild(row);
        });

        const addSentenceBtn = document.createElement('button');
        addSentenceBtn.className = 'btn btn-secondary';
        addSentenceBtn.style.width = '100%';
        addSentenceBtn.innerText = '➕ Additional Sentence';
        addSentenceBtn.onclick = () => {

    function createTextInputGroup(container, id, labelText, initialVal, onChange) {
      const group = document.createElement('div');
      group.className = 'form-group';

      const label = document.createElement('label');
      label.innerText = labelText;
      label.htmlFor = id;

      const isLong = (initialVal || '').length > 65 || labelText.toLowerCase().includes('description') || labelText.toLowerCase().includes('text');
      const input = isLong ? document.createElement('textarea') : document.createElement('input');

      if (!isLong) input.type = 'text';
      input.id = id;
      input.value = initialVal || '';
      input.addEventListener('input', (e) => onChange(e.target.value));

      group.appendChild(label);
      group.appendChild(input);
      container.appendChild(group);
    }

    function createDatePickerGroup(container, id, labelText, initialVal, onChange) {
      const group = document.createElement('div');
      group.className = 'form-group';

      const label = document.createElement('label');
      label.innerText = labelText;
      label.htmlFor = id;

      const input = document.createElement('input');
      input.type = 'date';
      input.id = id;
      input.value = parseToDateInput(initialVal);

      input.addEventListener('change', (e) => {
        const formatted = formatDateString(e.target.value);
        onChange(formatted);
      });

      group.appendChild(label);
      group.appendChild(input);
      container.appendChild(group);
    }

    function createColorPickerGroup(container, id, labelText, initialColor, onChange) {
      const group = document.createElement('div');
      group.className = 'form-group';

      const label = document.createElement('label');
      label.innerText = labelText;

      const wrapper = document.createElement('div');
      wrapper.className = 'color-picker-wrapper';

      const colorInput = document.createElement('input');
      colorInput.type = 'color';
      colorInput.id = id;
      colorInput.value = rgbToHex(initialColor);

      const hexSpan = document.createElement('span');
      hexSpan.style.fontSize = '0.75rem';
      hexSpan.style.color = '#94a3b8';
      hexSpan.innerText = colorInput.value;

      colorInput.addEventListener('input', (e) => {
        hexSpan.innerText = e.target.value;
        onChange(e.target.value);
      });

      wrapper.appendChild(colorInput);
      wrapper.appendChild(hexSpan);
      group.appendChild(label);
      group.appendChild(wrapper);
      container.appendChild(group);
    }

    function parseToDateInput(textStr) {
      if (!textStr) return '2026-07-08';
      const d = new Date(textStr);
      if (isNaN(d.getTime())) return '2026-07-08';
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatDateString(dateStr) {
      if (!dateStr) return '';
      const [year, month, day] = dateStr.split('-');
      const date = new Date(Date.UTC(year, month - 1, day));
      return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
    }

    function rgbToHex(rgbStr) {
      if (!rgbStr || rgbStr.startsWith('#')) return rgbStr || '#6b00c2';
      const rgb = rgbStr.match(/\d+/g);
      if (!rgb || rgb.length < 3) return '#6b00c2';
      return '#' + ((1 << 24) + (parseInt(rgb[0]) << 16) + (parseInt(rgb[1]) << 8) + parseInt(rgb[2])).toString(16).slice(1);
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Direct, reliable iframe update using srcdoc
    function updatePreview() {
      const htmlContent = getOutputHTML();
      const iframe = document.getElementById('preview-frame');
      if (iframe) {
        iframe.srcdoc = htmlContent;
      }
    }

    function downloadHTML() {
      const blob = new Blob([getOutputHTML()], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'xo_insider_newsletter.html';
      a.click();
    }

    function copyHTML() {
      navigator.clipboard.writeText(getOutputHTML()).then(() => {
        const status = document.getElementById('status-text');
        status.innerText = 'Copied to Clipboard!';
        status.style.color = '#ffe94f';
        setTimeout(() => {
          status.innerText = 'Ready';
          status.style.color = '#94a3b8';
        }, 2000);
      });
    }
